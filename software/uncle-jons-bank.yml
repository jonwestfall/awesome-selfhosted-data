# software name
name: "Uncle Jon's Bank"
# URL of the software project's homepage
website_url: "https://github.com/jonwestfall/uncle-jons-bank"
# URL where the full source code of the program can be downloaded
source_code_url: "https://github.com/jonwestfall/uncle-jons-bank"
# description of what the software does, shorter than 250 characters, sentence case
description: "Uncle Jon’s Bank is a web-based financial education platform for kids, designed to simulate real-world money management in a safe, gamified environment. Parents act as the bank tellers and regulators, while kids build budgeting, saving, and delayed gratification habits."
